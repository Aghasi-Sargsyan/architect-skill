name: Architect Team CI

on:
  push:
    branches:
      - master
      - main
      - 'cycle/**'
  pull_request:
    branches:
      - master
      - main
      - 'cycle/**'

jobs:
  task-gate:
    name: Task PR Gate (task/T-NNN -> cycle/*)
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'cycle/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge ref with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract task ID and run mechanical task gate
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^task/(T-[0-9]+)($|[-/]) ]]; then
            echo "Error: PR branch into $BASE_REF must be named task/T-NNN (got: $HEAD_REF)" >&2
            exit 1
          fi
          TASK_ID="${BASH_REMATCH[1]}"
          ORCH=".agents/skills/architect/orchestrator/run.mjs"
          if [ ! -f "$ORCH" ]; then
            ORCH=".claude/skills/architect/orchestrator/run.mjs"
          fi
          node "$ORCH" --check-task "$TASK_ID" --base "origin/$BASE_REF"

  cycle-self-check:
    name: Cycle Branch Self-Check (push -> cycle/*)
    if: github.event_name == 'push' && startsWith(github.ref_name, 'cycle/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Architect self-check on cycle branch
        run: |
          ORCH=".agents/skills/architect/orchestrator/run.mjs"
          if [ ! -f "$ORCH" ]; then
            ORCH=".claude/skills/architect/orchestrator/run.mjs"
          fi
          node "$ORCH" --self-check

  full-suite:
    name: Full Test Suite & Self-Check (master/main)
    if: >
      (github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'master' || github.base_ref == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Architect self-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          ORCH=".agents/skills/architect/orchestrator/run.mjs"
          if [ ! -f "$ORCH" ]; then
            ORCH=".claude/skills/architect/orchestrator/run.mjs"
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            node "$ORCH" --self-check --base "origin/$BASE_REF"
          else
            node "$ORCH" --self-check
          fi

      - name: Run full project test suite from config
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            import { execFileSync, spawnSync } from "node:child_process";
            import { pathToFileURL } from "node:url";

            const orchDir = fs.existsSync(".agents/skills/architect/orchestrator/run.mjs")
              ? path.resolve(".agents/skills/architect/orchestrator")
              : path.resolve(".claude/skills/architect/orchestrator");
            const { commandProblem } = await import(pathToFileURL(path.join(orchDir, "permissions.mjs")).href);
            const { splitCommandArgs } = await import(pathToFileURL(path.join(orchDir, "mechanics.mjs")).href);
            const { effectiveBlockedScripts } = await import(pathToFileURL(path.join(orchDir, "runners.mjs")).href);

            const cfgRel = fs.existsSync(".architect/config.json") ? ".architect/config.json" : ".agents/orchestrator.json";
            let cfgText = null;
            if (process.env.EVENT_NAME === "pull_request" && process.env.BASE_REF) {
              for (const cand of [".architect/config.json", ".agents/orchestrator.json"]) {
                try {
                  cfgText = execFileSync("git", ["show", `origin/${process.env.BASE_REF}:${cand}`], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] });
                  if (cfgText) break;
                } catch { cfgText = null; }
              }
            }
            if (!cfgText && fs.existsSync(cfgRel)) cfgText = fs.readFileSync(cfgRel, "utf8");
            const cfg = cfgText ? JSON.parse(cfgText) : {};
            const cmd = String(cfg.fullTestCommand || (Array.isArray(cfg.allowedCommands) && cfg.allowedCommands[0]) || "npm test").trim();
            const problem = commandProblem(cmd, effectiveBlockedScripts(cfg));
            if (problem) {
              console.error(`Error: unsafe fullTestCommand "${cmd}" — ${problem}`);
              process.exit(1);
            }
            const tokens = splitCommandArgs(cmd);
            if (!tokens.length) {
              console.error("Error: empty fullTestCommand");
              process.exit(1);
            }
            console.log(`Running full test command: ${cmd}`);
            const res = spawnSync(tokens[0], tokens.slice(1), { stdio: "inherit", shell: false });
            process.exit(res.status ?? 1);
          '
