name: CI

on:
  push:
    branches:
      - master
      - main
      - 'cycle/**'
  pull_request:
    branches:
      - master
      - main
      - 'cycle/**'

jobs:
  task-gate:
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'cycle/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run mechanical task PR gate
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^task/(T-[0-9]+)($|[-/]) ]]; then
            echo "Error: PR branch into $BASE_REF must be named task/T-NNN (got: $HEAD_REF)" >&2
            exit 1
          fi
          TASK_ID="${BASH_REMATCH[1]}"
          node .agents/skills/architect/orchestrator/run.mjs --check-task "$TASK_ID" --base "origin/$BASE_REF"

  cycle-self-check:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'cycle/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run orchestrator self-check on cycle branch
        run: node .agents/skills/architect/orchestrator/run.mjs --self-check

  test:
    if: >
      (github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'master' || github.base_ref == 'main'))
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite with packaging verification
        run: VERIFY_STEP_A1=1 npm test

      - name: Run orchestrator self-check
        run: node .agents/skills/architect/orchestrator/run.mjs --self-check
