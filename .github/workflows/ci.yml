name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite with packaging verification
        run: VERIFY_STEP_A1=1 npm test

      - name: Run orchestrator self-check
        run: node .agents/skills/architect/orchestrator/run.mjs --self-check
